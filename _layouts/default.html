<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
{% feed_meta %}
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="サイト内メニュー">
      <a href="{{ '/' | relative_url }}#articles">記事</a>
      <a href="{{ '/about/' | relative_url }}">サイトについて</a>
    </nav>
  </div>
</header>
<main id="main">{{ content }}</main>
<footer class="site-footer">
  <div class="shell footer-inner">
    <div>
      <p class="footer-brand">{{ site.title }}</p>
      <p>オフィス移転・改装を担当する方のための実務ノート</p>
    </div>
    <div class="footer-note">
      <p>記事の一部に広告（アフィリエイトリンク）を含みます。広告を含む記事には「PR」と表示しています。</p>
      <p>© {{ site.time | date: '%Y' }} {{ site.title }}</p>
    </div>
  </div>
</footer>
</body>
</html>
